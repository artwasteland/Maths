<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="/fonts/fonts.css" />
<style>
  :root{ --ground:#08090c; --band:#0f1117; --ink:#ece9e2; --soft:#aba796; --faint:#6f6a5c;
    --accent:#deae45; --dim:#967428; --rule:#221f1a;
    --serif:"Fraunces",Georgia,serif; --mono:"Martian Mono",monospace; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1200px;height:630px;background:var(--ground);color:var(--ink);font-family:var(--serif);overflow:hidden;position:relative;}
  body::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 18% 0%,transparent 50%,rgba(0,0,0,0.6) 100%),
    repeating-linear-gradient(to bottom,rgba(255,255,255,0.014) 0,rgba(255,255,255,0.014) 1px,transparent 2px,transparent 3px);}
  .pad{position:relative;height:100%;display:flex;align-items:center;padding:0 64px;gap:30px;}
  .left{flex:1 1 0;}
  .eyebrow{font-family:var(--mono);font-size:17px;letter-spacing:0.28em;text-transform:uppercase;color:var(--faint);}
  h1{font-weight:500;font-size:82px;line-height:1.0;letter-spacing:-0.02em;margin:20px 0 22px;}
  .sub{font-size:27px;line-height:1.32;color:var(--soft);max-width:19ch;}
  .sub b{color:var(--accent);font-weight:500;}
  .seq{font-family:var(--mono);font-size:19px;letter-spacing:0.03em;color:var(--faint);margin-top:26px;border-top:1px solid var(--rule);padding-top:16px;line-height:1.6;}
  .seq b{color:var(--accent);}
  .right{flex:0 0 420px;display:flex;align-items:center;justify-content:center;}
  .ringlabel{font-family:var(--mono);font-weight:600;font-size:26px;fill:var(--ink);}
  .ringfrac{font-family:var(--mono);font-size:22px;fill:var(--accent);}
  .brand{position:absolute;bottom:34px;left:64px;font-family:var(--mono);font-size:15px;letter-spacing:0.18em;text-transform:uppercase;color:var(--faint);}
  .brand b{color:var(--soft);font-weight:400;}
</style></head>
<body>
<div class="pad">
  <div class="left">
    <div class="eyebrow">Artificial Wasteland · Pattern</div>
    <h1>A Triangle<br/>at Two</h1>
    <div class="sub">A coin hides no Penney triangle until length four. A <b>three-sided die</b> has one at length two.</div>
    <div class="seq">AB ▸ BC ▸ CA ▸ AB &nbsp;— each <b>3/5</b><br/>more faces, tighter loops · new OEIS sequences</div>
  </div>
  <div class="right">
    <svg id="ring" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="ring"></svg>
  </div>
</div>
<div class="brand">artwaste.land &nbsp;·&nbsp; <b>the coin grows a third face</b></div>
<script>
(function(){
  function corr(X,Y,q){var L=X.length,t=0;for(var k=1;k<=L;k++){if(X.slice(-k)===Y.slice(0,k))t+=Math.pow(q,k-1);}return t;}
  function gcd(x,y){x=Math.abs(x);y=Math.abs(y);while(y){var t=y;y=x%y;x=t;}return x||1;}
  function pfrac(A,B,q){var AA=corr(A,A,q),AB=corr(A,B,q),BA=corr(B,A,q),BB=corr(B,B,q);var n=BB-BA,d=(BB-BA)+(AA-AB),g=gcd(n,d);return n/g+"/"+(d/g);}
  var cyc=["AB","BC","CA"],q=3,svg=document.getElementById("ring"),NS="http://www.w3.org/2000/svg";
  var cx=200,cy=205,R=132;
  var pos=cyc.map(function(_,i){var a=-Math.PI/2+i*2*Math.PI/3;return{x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)};});
  function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
  var defs=mk("defs",{}),m=mk("marker",{id:"ah",markerWidth:"9",markerHeight:"9",refX:"7",refY:"3",orient:"auto"});
  m.appendChild(mk("path",{d:"M0,0 L7,3 L0,6 Z",fill:"#deae45"}));defs.appendChild(m);svg.appendChild(defs);
  for(var i=0;i<3;i++){
    var p=pos[i],r=pos[(i+1)%3],dx=r.x-p.x,dy=r.y-p.y,len=Math.sqrt(dx*dx+dy*dy),ux=dx/len,uy=dy/len,pad=42;
    var x1=p.x+ux*pad,y1=p.y+uy*pad,x2=r.x-ux*pad,y2=r.y-uy*pad,mx=(x1+x2)/2-uy*24,my=(y1+y2)/2+ux*24;
    svg.appendChild(mk("path",{d:"M"+x1+" "+y1+" Q "+mx+" "+my+" "+x2+" "+y2,fill:"none",stroke:"#967428","stroke-width":"2.2","marker-end":"url(#ah)"}));
    var t=mk("text",{x:mx-uy*6,y:my+ux*6,"text-anchor":"middle","dominant-baseline":"middle",class:"ringfrac"});t.textContent=pfrac(cyc[i],cyc[(i+1)%3],q);svg.appendChild(t);
  }
  for(var j=0;j<3;j++){
    svg.appendChild(mk("circle",{cx:pos[j].x,cy:pos[j].y,r:"38",fill:"#05060a",stroke:"#967428","stroke-width":"2"}));
    var lab=mk("text",{x:pos[j].x,y:pos[j].y,"text-anchor":"middle","dominant-baseline":"central",class:"ringlabel"});lab.textContent=cyc[j];svg.appendChild(lab);
  }
  window.__ogready=true;
})();
</script>
</body>
</html>
